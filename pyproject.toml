[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intelligence-copilot"
version = "0.1.0"
description = "Evidence-grounded annual-report research, starting with PDF ingestion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.26.7", "streamlit==1.66.1", "plotly==7.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[project.scripts]
fic-parse-pdf = "financial_intelligence_copilot.pdf_parser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
